<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pahunch — Realtime Voice Demo</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --dim: #8b949e; --accent: #2f81f7; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; }
  #state-chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--dim); font-size: 12px; }
  #state-chip.active { color: var(--ok); border-color: var(--ok); }
  main { display: grid; grid-template-columns: 260px 1fr 320px; gap: 16px; padding: 16px 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); margin: 0 0 10px; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  .order { border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    margin-bottom: 8px; cursor: pointer; }
  .order:hover { border-color: var(--accent); }
  .order .id { font-weight: bold; }
  .order .meta { color: var(--dim); font-size: 12px; }
  #log { height: 320px; overflow-y: auto; font-size: 13px; }
  .entry { margin-bottom: 8px; }
  .entry .who { color: var(--dim); }
  .entry.customer .who { color: var(--ok); }
  .entry.agent .who { color: var(--accent); }
  .entry.system { color: var(--dim); font-size: 12px; }
  .entry.error { color: var(--bad); }
  #meter-wrap { height: 14px; background: #21262d; border-radius: 7px; overflow: hidden;
    margin: 8px 0; }
  #meter { height: 100%; width: 0%; background: var(--ok); transition: width 60ms linear; }
  #ptt { padding: 14px 0; width: 100%; user-select: none; }
  #ptt.held { background: var(--ok); border-color: var(--ok); color: #0d1117; }
  pre { background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; overflow-x: auto; font-size: 12px; margin: 0; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row button { flex: 1; }
  #text-input { flex: 3; background: #0d1117; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit; }
  #text-input:focus { outline: none; border-color: var(--accent); }
  #send-btn { flex: 1; }
  label { color: var(--dim); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .kv { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .kv b { color: var(--text); font-weight: normal; }
</style>
</head>
<body>
<header>
  <h1>Pahunch — realtime voice demo</h1>
  <span id="state-chip">IDLE</span>
  <span id="latency" class="kv"></span>
</header>
<main>
  <section class="panel">
    <h2>Orders</h2>
    <div id="orders">Loading…</div>
  </section>

  <section class="panel">
    <h2>Conversation</h2>
    <div id="log"></div>
    <div id="meter-wrap"><div id="meter"></div></div>
    <div id="mic-status" class="kv" role="status" aria-live="polite">Microphone off</div>
    <div class="row">
      <button id="mic-btn" class="primary">Start mic</button>
      <button id="ptt">Hold to talk</button>
    </div>
    <div class="row">
      <button id="demo-btn">Run scripted demo</button>
    </div>
    <div class="row">
      <input id="text-input" type="text" placeholder="No mic? type the customer's line here" />
      <button id="send-btn">Send</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="auto-listen" checked /> auto-listen after agent speech</label>
    </div>
    <div class="row">
      <button id="commit-btn" disabled>Commit plan</button>
      <button id="end-btn" disabled>End call</button>
    </div>
  </section>

  <section class="panel">
    <h2>Execution</h2>
    <div id="verdict" class="kv">No plan yet.</div>
    <div id="courier" class="kv">No commit yet.</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $("log"), meterEl = $("meter"), chipEl = $("state-chip"), latencyEl = $("latency");
const verdictEl = $("verdict"), courierEl = $("courier");
const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;

// A scripted demo replays a fixed Hinglish conversation. The customer's turns
// skip speech recognition; the planner, policy engine and commit are the live
// path, so the demo shows real behaviour instead of a mock.
const DEMO_TURNS = [
  "Mujhe parcel abhi mat do, shaam ko chhah se aath ke beech le aana.",
  "Haan theek hai, kar do.",
];

const state = {
  sessionId: null, ws: null, streaming: false, auto: true,
  audioCtx: null, node: null, playing: null, speaking: false,
  player: null, demoQueue: [], demoRunning: false,
  connecting: false, generationId: null, lastGenerationId: 0,
  generationEnded: false, outputKind: null, blobDone: false,
  micStream: null, micSource: null,
  connectionId: 0, micEpoch: 0,
  micHint: null, micHintReason: null,
};

function log(who, text) {
  const div = document.createElement("div");
  div.className = `entry ${who}`;
  const label = document.createElement("span");
  label.className = "who";
  label.textContent = who === "customer" ? "customer" : who === "agent" ? "agent" : "system";
  const content = document.createElement("span");
  content.textContent = ` ${text}`;
  div.appendChild(label);
  div.appendChild(content);
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}
function setState(name) {
  chipEl.textContent = name;
  chipEl.className = name === "IDLE" ? "" : "active";
}
function fmtMs(ms) { return ms == null ? "" : `${ms} ms`; }

async function loadOrders() {
  const orders = await (await fetch("/api/orders")).json();
  $("orders").innerHTML = "";
  for (const order of orders) {
    const div = document.createElement("div");
    div.className = "order";
    div.innerHTML = `<span class="id">#${order.id}</span> ${order.merchant_name}<br/>
      <span class="meta">${order.delivery_address_summary}<br/>
      window ${order.window_start?.slice(11, 16) ?? "?"}–${order.window_end?.slice(11, 16) ?? "?"} ·
      ${order.payment_mode} · OTP: ${order.requires_otp ? "yes" : "no"} · value ₹${order.declared_value_inr}</span>`;
    div.onclick = () => startCall(order.id);
    $("orders").appendChild(div);
  }
}

async function startCall(orderId) {
  if (state.connecting) return;
  state.connecting = true;
  try {
  log("system", `starting call for order ${orderId}…`);
  // The AudioContext must exist before the socket connects: the server is told
  // its sample rate and synthesises the agent voice at exactly that rate.
  try {
    await ensureAudio();
  } catch (error) {
    log("error", `audio output unavailable: ${error.message}`);
  }
  let created = await fetch(`/api/orders/${orderId}/call`, { method: "POST" });
  let call;
  if (created.status === 409) {
    const active = await fetch(`/api/orders/${orderId}/active-call`);
    if (!active.ok) {
      log("error", (await created.json()).detail);
      return;
    }
    call = await active.json();
    setState(call.state);
    log("system", `resuming active call ${call.id} (${call.state})`);
  } else if (created.ok) {
    call = await created.json();
  } else {
    log("error", (await created.json()).detail);
    return;
  }
  for (const [from, action] of [["CALLING", "connect"], ["CONNECTED", "context-confirmation"]]) {
    if (call.state !== from) continue;
    const response = await fetch(`/api/sessions/${call.id}/${action}`, { method: "POST" });
    if (!response.ok) {
      log("error", (await response.json()).detail);
      return;
    }
    call = await response.json();
  }
  if (!["DISCOVERY", "NEGOTIATION", "PENDING_CONFIRMATION"].includes(call.state)) {
    log("error", `Call cannot accept voice in ${call.state}.`);
    return;
  }
  log("system", `session ${call.id} ready`);
  await connectSocket(call.id);
  } catch (error) {
    log("error", `call connection failed: ${error.message}`);
  } finally {
    state.connecting = false;
  }
}

async function connectSocket(sessionId) {
  if (state.ws && state.sessionId === sessionId && state.ws.readyState <= 1) return;
  const previous = state.ws;
  state.ws = null;
  state.streaming = false;
  stopPlayback();
  if (previous && previous.readyState !== 3) {
    await new Promise((resolve) => {
      previous.addEventListener("close", resolve, { once: true });
      previous.close();
    });
  }
  state.sessionId = sessionId;
  state.lastGenerationId = 0;
  state.connectionId += 1;
  if (state.player) state.player.port.postMessage({ type: "connection", connection_id: state.connectionId });
  const ws = new WebSocket(`${wsUrl}/ws/sessions/${sessionId}/voice`);
  state.ws = ws;
  ws.binaryType = "arraybuffer";
  $("commit-btn").disabled = false;
  $("end-btn").disabled = false;

  ws.onopen = () => { if (state.ws === ws) log("system", "socket open, waiting for ready…"); };
  ws.onclose = () => {
    if (state.ws !== ws) return;
    state.ws = null;
    state.streaming = false;
    stopPlayback();
    releaseMic();
    state.demoRunning = false;
    state.demoQueue = [];
    log("system", "socket closed");
    setState("IDLE");
  };

  const handleEvent = async (event) => {
    switch (event.type) {
      case "ready":
        setState(event.state);
        log("system", `ready — call state ${event.state}`);
        sendAudioConfig();
        if (!state.demoRunning && state.auto) {
          sendStart();
        }
        break;
      case "config_ack":
        log("system", `agent audio rate ${event.tts_sample_rate} Hz`);
        break;
      case "listening":
        state.streaming = true;
        state.micHint = state.micHintReason = null;
        $("mic-status").textContent = "Listening";
        log("system", "listening…");
        break;
      case "audio_level":
        if (event.speech || (state.micHintReason === "NO_AUDIO_FRAMES" && event.received_frames > 0)) {
          state.micHint = state.micHintReason = null;
        }
        meterEl.style.background = event.noise_limited ? "var(--warn)" : "var(--ok)";
        $("mic-status").textContent = state.micHint || (event.calibrating
          ? "Adjusting to room noise — stay quiet briefly."
          : event.noise_limited ? "Background noise is too loud — move somewhere quieter."
          : event.speech ? "Heard you" : "Listening");
        break;
      case "no_speech": {
        const hints = {
          NO_AUDIO_FRAMES: "No microphone audio is reaching the server. Start mic or check microphone permission.",
          NO_SPEECH_DETECTED: "No speech detected. Move closer to the microphone and try again.",
          EXCESSIVE_NOISE: "Background noise is too loud. Move somewhere quieter or reduce microphone gain.",
          AUDIO_STREAM_STOPPED: "Microphone audio stopped. Reconnect the call, then start mic again.",
          SPEECH_TOO_SHORT: "Heard only a short sound. Please repeat your full instruction.",
        };
        state.micHintReason = event.reason;
        state.micHint = hints[event.reason] || hints.NO_SPEECH_DETECTED;
        $("mic-status").textContent = state.micHint;
        log("system", state.micHint);
        break;
      }
      case "speech_start":
        state.micHint = state.micHintReason = null;
        $("mic-status").textContent = "Heard you";
        log("system", "speech detected");
        break;
      case "speech_end":
        $("mic-status").textContent = "Processing your reply…";
        log("system", `utterance end (${event.duration_ms} ms)`);
        break;
      case "stop_speaking":
        if (event.generation_id !== state.generationId) break;
        stopPlayback(event.generation_id);
        log("system", "barge-in: agent stopped speaking");
        break;
      case "turn":
        if (!acceptGeneration(event.generation_id)) break;
        setState(event.state);
        log("customer", `“${event.transcript}” (${event.detected_language ?? "?"}, conf ${event.transcript_confidence})`);
        log("agent", `“${event.agent_message}”`);
        log("system", `turn ${event.turn.turn_count} · ${event.planner.model} · ${event.planner.action} · ` +
          `${event.planner.response_language ?? "?"} · wording ${event.planner.wording_source ?? "?"}` +
          `${event.planner.fallback_reason ? ` (${event.planner.fallback_reason})` : ""} · ` +
          `stt ${fmtMs(event.timings.stt_ms)} · planner ${fmtMs(event.timings.planner_ms)}`);
        if (event.stt_fallback_reason) {
          log("system", `streaming recognition fallback: ${event.stt_fallback_reason}`);
        }
        if (event.turn.verdict) {
          verdictEl.innerHTML = `<b>Plan verdict:</b> ${event.turn.verdict.valid ? "valid" : "INVALID"}` +
            (event.turn.verdict.violations?.length
              ? `<br/>violations: ${event.turn.verdict.violations.map((v) => v.code).join(", ")}` : "");
        }
        if (event.turn.customer_confirmed) {
          log("system", "customer confirmed — committing plan");
          await commitPlan();
        }
        break;
      case "agent_audio_chunk":
        if (!acceptGeneration(event.generation_id)) break;
        state.speaking = true;
        playChunk(event.chunk_base64, event.generation_id);
        break;
      case "agent_audio":
        if (!acceptGeneration(event.generation_id)) break;
        if (event.audio_base64) {
          state.speaking = true;
          await playAudio(event.audio_base64, event.content_type, event.generation_id, ws);
        }
        break;
      case "agent_audio_end":
        if (!acceptGeneration(event.generation_id)) break;
        state.generationEnded = true;
        latencyEl.innerHTML = event.timings?.first_audio_ms
          ? `first audio <b>${event.timings.first_audio_ms} ms</b>`
          : "";
        log("system", `audio done — first audio ${fmtMs(event.timings?.first_audio_ms)} · ` +
          `tts ${fmtMs(event.timings?.tts_ms)} · total ${fmtMs(event.timings?.total_ms)}` +
          `${event.ack_played ? " · ack" : ""}` +
          `${event.audio_error ? ` [TTS ${event.audio_error}]` : ""}`);
        if (state.outputKind === "blob") {
          if (state.blobDone) finishPlayback(event.generation_id, ws);
        } else if (state.player) {
          if (state.outputKind === null) {
            state.player.port.postMessage({ type: "begin", generation_id: event.generation_id,
              connection_id: state.connectionId });
          }
          state.player.port.postMessage({ type: "end", generation_id: event.generation_id,
            connection_id: state.connectionId });
        } else {
          log("error", "audio output unavailable; reply is shown as text");
          finishPlayback(event.generation_id, ws);
        }
        break;
      case "error":
        log("error", event.detail);
        break;
    }
  };
  ws.onmessage = (event) => {
    if (state.ws !== ws) return;
    if (typeof event.data === "string") {
      handleEvent(JSON.parse(event.data)).catch((error) => log("error", `voice event failed: ${error.message}`));
    }
  };
}

function sendStart() {
  if (state.ws && state.ws.readyState === 1) {
    state.streaming = true;
    state.ws.send(JSON.stringify({ type: "start" }));
  }
}
function sendStop() {
  if (state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify({ type: "stop" }));
}

// The agent is synthesised at the browser's native rate so playback needs no
// resampling and the first chunk is audible as soon as it exists.
function sendAudioConfig() {
  if (!state.ws || state.ws.readyState !== 1) return;
  const rate = state.audioCtx ? Math.round(state.audioCtx.sampleRate) : 16000;
  state.ws.send(JSON.stringify({ type: "config", tts_sample_rate: rate,
    playback_tracking: true, audio_feedback: true }));
}

function stopPlayback(generationId = state.generationId) {
  state.generationId = null;
  state.generationEnded = false;
  state.outputKind = null;
  state.blobDone = false;
  state.speaking = false;
  if (state.playing) {
    const source = state.playing;
    state.playing = null;
    source.onended = null;
    source.stop();
  }
  if (state.player) state.player.port.postMessage({ type: "flush", generation_id: generationId,
    connection_id: state.connectionId });
}

function acceptGeneration(generationId) {
  if (!Number.isInteger(generationId) || generationId < state.lastGenerationId) return false;
  if (generationId === state.generationId) return true;
  if (generationId === state.lastGenerationId) return false;
  stopPlayback();
  state.lastGenerationId = generationId;
  state.generationId = generationId;
  return true;
}

function finishPlayback(generationId, ws) {
  if (state.ws !== ws || state.generationId !== generationId || !state.generationEnded) return;
  state.generationId = null;
  state.speaking = false;
  if (ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: "playback_done", generation_id: generationId }));
  if (state.demoRunning) {
    setTimeout(() => { if (state.ws === ws && state.generationId === null) nextDemoTurn(); }, 400);
  } else if (state.auto) {
    sendStart();
  }
}

async function ensureAudio() {
  if (state.audioCtx) return;
  state.audioCtx = new AudioContext();
  await state.audioCtx.audioWorklet.addModule("/worklet.js");
  await state.audioCtx.audioWorklet.addModule("/pcm-player.js");
  const player = new AudioWorkletNode(state.audioCtx, "pcm-player");
  player.port.onmessage = (event) => {
    if (event.data.type === "drained" && event.data.connection_id === state.connectionId) {
      finishPlayback(event.data.generation_id, state.ws);
    }
  };
  player.connect(state.audioCtx.destination);
  state.player = player;
  await state.audioCtx.resume();
}

function playChunk(base64, generationId) {
  if (!state.player) return;
  if (state.outputKind !== "pcm") {
    state.outputKind = "pcm";
    state.player.port.postMessage({ type: "begin", generation_id: generationId,
      connection_id: state.connectionId });
  }
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  const view = new DataView(bytes.buffer);
  const samples = new Float32Array(Math.floor(bytes.length / 2));
  for (let i = 0; i < samples.length; i++) {
    const value = view.getInt16(i * 2, true);
    samples[i] = value < 0 ? value / 32768 : value / 32767;
  }
  state.player.port.postMessage({ type: "pcm", generation_id: generationId,
    connection_id: state.connectionId, samples }, [samples.buffer]);
}

async function playAudio(base64, contentType, generationId, ws) {
  state.outputKind = "blob";
  if (!state.audioCtx) {
    state.blobDone = true;
    log("error", "audio output unavailable; reply is shown as text");
    return;
  }
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  let buffer;
  try {
    buffer = await state.audioCtx.decodeAudioData(bytes.buffer);
  } catch (error) {
    if (state.ws !== ws || state.generationId !== generationId) return;
    state.blobDone = true;
    log("error", `audio playback failed: ${error.message}`);
    finishPlayback(generationId, ws);
    return;
  }
  if (state.ws !== ws || state.generationId !== generationId) return;
  const source = state.audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(state.audioCtx.destination);
  state.playing = source;
  source.onended = () => {
    if (state.playing !== source || state.ws !== ws || state.generationId !== generationId) return;
    state.playing = null;
    state.blobDone = true;
    finishPlayback(generationId, ws);
  };
  source.start();
}

async function ensureMic() {
  const epoch = state.micEpoch;
  await ensureAudio();
  if (state.node) return;
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
  });
  if (epoch !== state.micEpoch || state.node) {
    stream.getTracks().forEach((track) => track.stop());
    return;
  }
  const source = state.audioCtx.createMediaStreamSource(stream);
  state.micStream = stream;
  state.micSource = source;
  state.node = new AudioWorkletNode(state.audioCtx, "mic-resampler");
  state.node.port.onmessage = (event) => {
    if (event.data.type === "audio") {
      if (state.streaming && state.ws && state.ws.readyState === 1) {
        state.ws.send(event.data.buffer);
      }
    } else if (event.data.type === "level") {
      meterEl.style.width = `${Math.min(100, event.data.rms * 400)}%`;
    }
  };
  source.connect(state.node);
  log("system", "microphone on — audio is streamed only while listening");
}

function releaseMic() {
  state.micEpoch += 1;
  if (state.micStream) state.micStream.getTracks().forEach((track) => track.stop());
  if (state.micSource) state.micSource.disconnect();
  if (state.node) { state.node.port.onmessage = null; state.node.disconnect(); }
  state.micStream = state.micSource = state.node = null;
  meterEl.style.width = "0%";
  $("mic-btn").disabled = false;
  state.micHint = state.micHintReason = null;
  $("mic-status").textContent = "Microphone off";
}

function nextDemoTurn() {
  if (!state.demoRunning) return;
  const text = state.demoQueue.shift();
  if (!text) {
    state.demoRunning = false;
    log("system", "demo finished");
    return;
  }
  log("system", `scripted turn: “${text}”`);
  state.ws.send(JSON.stringify({ type: "scripted_turn", text }));
}

async function commitPlan() {
  const sessionId = state.sessionId;
  const ws = state.ws;
  const result = await fetch(`/api/sessions/${sessionId}/commit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ idempotency_key: `demo-${sessionId}` }),
  });
  if (state.ws !== ws || state.sessionId !== sessionId) return;
  if (!result.ok) {
    log("error", `commit failed: ${(await result.json()).detail}`);
    return;
  }
  const body = await result.json();
  if (state.ws !== ws || state.sessionId !== sessionId) return;
  setState(body.state);
  log("system", `plan committed (${body.reused ? "reused" : "new"} commit ${body.commit_id})`);
  courierEl.innerHTML = "<b>Courier card</b>";
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(body.courier_card, null, 2);
  courierEl.appendChild(pre);
}

$("mic-btn").onclick = async () => {
  $("mic-btn").disabled = true;
  try {
    await ensureMic();
  } catch (error) {
    $("mic-btn").disabled = false;
    log("error", `microphone blocked (${error.name || error.message}). ` +
      "Allow microphone access for this page in the browser's site settings, or type below instead.");
  }
};
$("send-btn").onclick = sendTypedLine;
$("text-input").onkeydown = (event) => {
  if (event.key === "Enter") sendTypedLine();
};
function sendTypedLine() {
  const input = $("text-input");
  const text = input.value.trim();
  if (!text) return;
  if (!state.ws || state.ws.readyState !== 1) {
    log("error", "start a call first — click an order on the left");
    return;
  }
  state.auto = false;
  $("auto-listen").checked = false;
  input.value = "";
  log("system", "typed input submitted");
  stopPlayback();
  state.ws.send(JSON.stringify({ type: "reset" }));
  state.ws.send(JSON.stringify({ type: "scripted_turn", text }));
}
$("demo-btn").onclick = async () => {
  await ensureAudio();
  state.demoQueue = [...DEMO_TURNS];
  state.demoRunning = true;
  state.auto = false;
  $("auto-listen").checked = false;
  log("system", "scripted demo — customer turns skip speech recognition");
  if (state.ws && state.ws.readyState === 1) {
    nextDemoTurn();
  } else {
    const orders = await (await fetch("/api/orders")).json();
    if (!orders.length) {
      log("error", "no orders to demo");
      state.demoRunning = false;
      return;
    }
    await startCall(orders[0].id);
  }
};
$("ptt").addEventListener("pointerdown", async () => {
  if (!state.ws) return;
  state.auto = false;
  $("auto-listen").checked = false;
  try {
    await ensureMic();
  } catch (error) {
    log("error", `microphone blocked (${error.name || error.message}) — type below instead`);
    return;
  }
  stopPlayback();
  state.ws.send(JSON.stringify({ type: "reset" }));
  sendStart();
  state.streaming = true;
  $("ptt").classList.add("held");
});
$("ptt").addEventListener("pointerup", () => {
  sendStop();
  state.streaming = false;
  $("ptt").classList.remove("held");
});
$("auto-listen").onchange = (event) => { state.auto = event.target.checked; };
$("commit-btn").onclick = commitPlan;
$("end-btn").onclick = () => { if (state.ws) state.ws.close(); setState("IDLE"); };

loadOrders();
</script>
</body>
</html>
